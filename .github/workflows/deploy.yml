# 纯静态站点 → GitHub Pages（项目页 https://guolincq.github.io/homepage/）
#
# 首次使用需在仓库 Settings → Pages → Source 选择 "GitHub Actions"，
# 否则 configure-pages 步骤会报 "Get Pages site failed"。

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# 缺少 pages:write / id-token:write 时 deploy-pages 会 403
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一次部署；false = 不打断已经在跑的部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check dist
        run: ls -la dist && test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
