# 纯静态站点 → GitHub Pages（项目页 https://guolincq.github.io/homepage/）
#
# 首次使用需在仓库 Settings → Pages → Source 选择 "GitHub Actions"，
# 否则 configure-pages 步骤会报 "Get Pages site failed"。

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

# 缺少 pages:write / id-token:write 时 deploy-pages 会 403
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时刻只允许一次部署；false = 不打断已经在跑的部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    # 注意：这里刻意不声明 environment: github-pages。
    # 若在仓库为空时启用 Pages 的 "GitHub Actions" 源，GitHub 会创建 github-pages
    # 环境并附带部署分支策略，该策略可能不包含后来才推送的 main 分支，
    # 导致 job 在任何步骤执行前就被拒（表现为 steps=0、2 秒内失败）。
    # deploy-pages 本身不依赖该声明，去掉即可正常部署。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Dump build log to debug branch
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-debug 2>/dev/null || true
          git checkout -B ci-debug
          mkdir -p .cidebug
          cp build.log .cidebug/build.log 2>/dev/null || true
          git add -f .cidebug
          git commit -m "ci-debug: build log ${GITHUB_RUN_ID}" || echo "no change"
          git push -f origin ci-debug

      - name: Check dist
        run: ls -la dist && test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
